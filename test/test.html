<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>네트워크 & IT 핵심 요약 쇼츠</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100dvh;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #shortsContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100dvh;
            background: linear-gradient(135deg, #0f172a 0%, #090d16 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
        }
        /* Start Overlay */
        #startOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        .start-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            animation: pulseBtn 1.5s infinite;
            border: none;
            outline: none;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        /* Header & Progress */
        .header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            padding-top: 10px;
        }
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            display: flex;
            gap: 2px;
        }
        .progress-segment {
            flex: 1;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            transition: background 0.3s;
        }
        .progress-segment.active {
            background: #3b82f6;
        }
        .badge {
            align-self: flex-start;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Main Scene View */
        .scene-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 10px 0;
        }
        h1.title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }
        p.desc {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 1.5;
            max-width: 320px;
        }
        /* Visual Container */
        .visual-box {
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }
        /* Footer / Branding */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #64748b;
            z-index: 10;
            padding-bottom: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
        }
        /* Animations & SVG Styling */
        .node-circle {
            fill: #1e293b;
            stroke: #3b82f6;
            stroke-width: 3px;
            transition: all 0.3s;
        }
        .pulse-ring {
            animation: svgPulse 2s infinite;
            transform-origin: center;
            transform-box: fill-box;
        }
        @keyframes svgPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .data-packet {
            fill: #60a5fa;
            filter: drop-shadow(0 0 6px #3b82f6);
        }
    </style>
</head>
<body>

<div id="shortsContainer">
    <!-- 오토플레이 정책 우회 오버레이 -->
    <div id="startOverlay" onclick="startExperience()">
        <button class="start-btn">▶ 쇼츠 영상 시작하기</button>
    </div>

    <!-- 헤더 / 상단 진행바 -->
    <div class="header">
        <div class="progress-bar-container" id="progressBarContainer"></div>
        <div class="badge" id="sceneBadge">NETWORKING</div>
    </div>

    <!-- 컨텐츠 영역 -->
    <div class="scene-body">
        <div class="visual-box" id="visualBox"></div>
        <h1 class="title" id="sceneTitle">제목 로딩중...</h1>
        <p class="desc" id="sceneDesc">설명 로딩중...</p>
    </div>

    <!-- 푸터 -->
    <div class="footer">
        <span>⚡ Tech Shorts Master</span>
        <span id="sceneCounter">1 / 10</span>
    </div>
</div>

<script>
    const scenes = [
        {
            badge: "LAYER 2 / ETHERNET",
            title: "이더넷 & MAC 주소",
            desc: "동일 네트워크 대역 기기 간 통신을 위한 2계층 기술, 기기 고유의 물리적 주소인 MAC Address를 사용합니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <rect x="20" y="60" width="60" height="40" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
                    <text x="50" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">PC A</text>
                    <rect x="200" y="60" width="60" height="40" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                    <text x="230" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">PC B</text>
                    <line x1="80" y1="80" x2="200" y2="80" stroke="#64748b" stroke-width="2" stroke-dasharray="4"/>
                    <circle class="data-packet" cx="110" cy="80" r="6">
                        <animate attributeName="cx" values="90;190;90" dur="2s" repeatCount="indefinite"/>
                    </circle>
                    <text x="140" y="55" fill="#3b82f6" font-size="10" text-anchor="middle">MAC Address</text>
                </svg>
            `
        },
        {
            badge: "TOPOLOGY",
            title: "네트워크 토폴로지 구조",
            desc: "Bus, Star, Ring, Tree, Mesh 등 노드 연결 형태에 따라 비용, 신뢰성, 확장성이 달라집니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <!-- Star Topology -->
                    <circle cx="140" cy="80" r="16" fill="#3b82f6" class="pulse-ring"/>
                    <circle cx="140" cy="80" r="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
                    <circle cx="80" cy="40" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
                    <circle cx="200" cy="40" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
                    <circle cx="80" cy="120" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
                    <circle cx="200" cy="120" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
                    <line x1="130" y1="70" x2="90" y2="45" stroke="#475569" stroke-width="2"/>
                    <line x1="150" y1="70" x2="190" y2="45" stroke="#475569" stroke-width="2"/>
                    <line x1="130" y1="90" x2="90" y2="115" stroke="#475569" stroke-width="2"/>
                    <line x1="150" y1="90" x2="190" y2="115" stroke="#475569" stroke-width="2"/>
                </svg>
            `
        },
        {
            badge: "SWITCHING NETWORK",
            title: "회선 vs 메시지 vs 패킷 교환",
            desc: "패킷 교환은 데이터를 패킷 단위로 잘게 쪼개어 전송하며 비연결성으로 블로킹이 없습니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <rect x="30" y="65" width="40" height="30" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
                    <rect x="210" y="65" width="40" height="30" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                    <path d="M 75 80 Q 140 30 205 80" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4"/>
                    <path d="M 75 80 Q 140 130 205 80" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4"/>
                    <circle cx="140" cy="55" r="5" fill="#60a5fa">
                        <animateMotion path="M -65 25 Q 0 -25 65 25" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="140" cy="105" r="5" fill="#f43f5e">
                        <animateMotion path="M -65 25 Q 0 75 65 25" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            `
        },
        {
            badge: "LAN PROTOCOL",
            title: "CSMA/CD & CSMA/CA",
            desc: "유선랜(802.3)은 충돌 감지(CD) 후 재전송, 무선랜(802.11)은 충돌 회피(CA) 메커니즘을 사용합니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <line x1="40" y1="80" x2="240" y2="80" stroke="#3b82f6" stroke-width="4"/>
                    <circle cx="100" cy="80" r="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                    <circle cx="180" cy="80" r="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                    <circle cx="140" cy="50" r="8" fill="#ef4444">
                        <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
                    </circle>
                    <text x="140" y="110" fill="#f59e0b" font-size="12" text-anchor="middle">Collision Avoidance / Detect</text>
                </svg>
            `
        },
        {
            badge: "ERROR CONTROL",
            title: "에러 검출 및 ARQ 방식",
            desc: "패리티 검사, CRC, 해밍코드로 에러를 검출하고, Stop-and-Wait 등으로 재전송(BEC)을 수행합니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <rect x="50" y="60" width="60" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                    <text x="80" y="85" fill="#10b981" font-size="12" text-anchor="middle">CRC</text>
                    <rect x="170" y="60" width="60" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
                    <text x="200" y="85" fill="#3b82f6" font-size="12" text-anchor="middle">ARQ</text>
                    <path d="M 110 70 Q 140 40 170 70" fill="none" stroke="#60a5fa" stroke-width="2"/>
                    <path d="M 170 90 Q 140 120 110 90" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
                </svg>
            `
        },
        {
            badge: "STORAGE / RAID",
            title: "RAID 기술 개요",
            desc: "RAID 0(스트라이핑)부터 미러링(1), 분산 패리티(5, 6)를 통해 성능 향상과 데이터 안정성을 확보합니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <rect x="70" y="30" width="140" height="25" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
                    <rect x="70" y="65" width="140" height="25" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                    <rect x="70" y="100" width="140" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                    <text x="140" y="47" fill="#60a5fa" font-size="11" text-anchor="middle">Disk 0 (Striping)</text>
                    <text x="140" y="82" fill="#34d399" font-size="11" text-anchor="middle">Disk 1 (Mirroring)</text>
                    <text x="140" y="117" fill="#fbbf24" font-size="11" text-anchor="middle">Disk 2 (Parity)</text>
                </svg>
            `
        },
        {
            badge: "ROUTING PROTOCOL",
            title: "RIP, OSPF, BGP 라우팅",
            desc: "거리벡터 방식의 RIP, 링크상태 기반의 OSPF, AS 간 연결을 담당하는 BGP 프로토콜이 있습니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <circle cx="60" cy="80" r="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
                    <circle cx="140" cy="40" r="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                    <circle cx="140" cy="120" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
                    <circle cx="220" cy="80" r="16" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
                    <line x1="74" y1="70" x2="126" y2="50" stroke="#64748b" stroke-width="2"/>
                    <line x1="74" y1="90" x2="126" y2="110" stroke="#64748b" stroke-width="2"/>
                    <line x1="154" y1="50" x2="206" y2="70" stroke="#64748b" stroke-width="2"/>
                    <line x1="154" y1="110" x2="206" y2="90" stroke="#64748b" stroke-width="2"/>
                </svg>
            `
        },
        {
            badge: "DNS SYSTEM",
            title: "DNS 레코드와 라운드로빈",
            desc: "A, CNAME, MX 레코드 등 도메인 정보를 관리하며, 라운드로빈 방식으로 서버 부하를 분산합니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <rect x="90" y="20" width="100" height="35" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
                    <text x="140" y="42" fill="#60a5fa" font-size="12" text-anchor="middle">DNS Server</text>
                    <path d="M 140 55 L 70 110" stroke="#64748b" stroke-width="2"/>
                    <path d="M 140 55 L 140 110" stroke="#64748b" stroke-width="2"/>
                    <path d="M 140 55 L 210 110" stroke="#64748b" stroke-width="2"/>
                    <circle cx="70" cy="125" r="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                    <circle cx="140" cy="125" r="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                    <circle cx="210" cy="125" r="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                </svg>
            `
        },
        {
            badge: "SECURITY & HTTP",
            title: "IDS/IPS 및 HTTP 상태코드",
            desc: "IDS는 사후 탐지, IPS는 실시간 차단! HTTP 200(성공), 400(클라이언트 오류), 500(서버 오류)을 의미합니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <rect x="40" y="50" width="80" height="60" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
                    <text x="80" y="85" fill="#f43f5e" font-size="14" font-weight="bold" text-anchor="middle">IPS 403</text>
                    <rect x="160" y="50" width="80" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
                    <text x="200" y="85" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle">HTTP 200</text>
                </svg>
            `
        },
        {
            badge: "PACKET SWITCHING",
            title: "가상 회선 vs 데이터그램",
            desc: "가상 회선은 사전 경로 설정(연결지향), 데이터그램은 패킷별 독립 전송(비연결성) 방식을 사용합니다.",
            visual: `
                <svg width="280" height="160" viewBox="0 0 280 160">
                    <path d="M 40 80 Q 140 20 240 80" fill="none" stroke="#3b82f6" stroke-width="3"/>
                    <path d="M 40 80 Q 140 140 240 80" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4"/>
                    <circle cx="140" cy="50" r="6" fill="#60a5fa"/>
                    <circle cx="140" cy="110" r="6" fill="#fbbf24"/>
                    <text x="140" y="85" fill="#94a3b8" font-size="11" text-anchor="middle">Virtual Circuit / Datagram</text>
                </svg>
            `
        }
    ];

    let currentScene = 0;
    let speechStarted = false;
    let isStarted = false;
    let synth = window.speechSynthesis;

    // 진행바 동적 생성
    const progressBarContainer = document.getElementById('progressBarContainer');
    scenes.forEach((_, idx) => {
        const seg = document.createElement('div');
        seg.className = 'progress-segment';
        seg.id = `seg-${idx}`;
        progressBarContainer.appendChild(seg);
    });

    function startExperience() {
        if (isStarted) return;
        isStarted = true;

        const overlay = document.getElementById('startOverlay');
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 500);

        // 음성 엔진 언락 (빈 utterance 발화)
        if (synth) {
            const unlockUtterance = new SpeechSynthesisUtterance("");
            synth.speak(unlockUtterance);
        }

        playScene(0);
    }

    function updateProgress(idx) {
        scenes.forEach((_, i) => {
            const seg = document.getElementById(`seg-${i}`);
            if (i <= idx) {
                seg.classList.add('active');
            } else {
                seg.classList.remove('active');
            }
        });
    }

    function playScene(index) {
        if (index >= scenes.length) {
            // 쇼츠 종료 시 반복 또는 완료 처리
            currentScene = 0;
            playScene(0);
            return;
        }

        currentScene = index;
        const scene = scenes[index];

        // UI 렌더링
        document.getElementById('sceneBadge').innerText = scene.badge;
        document.getElementById('sceneTitle').innerText = scene.title;
        document.getElementById('sceneDesc').innerText = scene.desc;
        document.getElementById('visualBox').innerHTML = scene.visual;
        document.getElementById('sceneCounter').innerText = `${index + 1} / ${scenes.length}`;
        updateProgress(index);

        // 음성 합성
        if (synth) {
            synth.cancel();
            speechStarted = false;

            const utterance = new SpeechSynthesisUtterance(scene.title + ". " + scene.desc);
            utterance.rate = 1.15;
            utterance.pitch = 1.0;
            utterance.lang = 'ko-KR';

            utterance.onstart = () => {
                speechStarted = true;
            };

            utterance.onend = () => {
                if (speechStarted) {
                    playScene(currentScene + 1);
                }
            };

            utterance.onerror = () => {
                // 에러 발생 시에도 끊김 없이 다음 장면으로 넘어가도록 처리
                setTimeout(() => playScene(currentScene + 1), 1000);
            };

            // 약간의 딜레이 후 발화 실행
            setTimeout(() => {
                synth.speak(utterance);
            }, 100);
        } else {
            // 음성 지원이 안되는 브라우저 대비 폴백 타이머
            setTimeout(() => playScene(currentScene + 1), 4000);
        }
    }
</script>

</body>
</html>
